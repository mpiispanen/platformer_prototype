name: Image Regression Tests

on: 
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  image-regression:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Install X11 libraries
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Install Xvfb for headless testing
      run: sudo apt-get install -y xvfb

    - name: Set up CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build
      run: cmake --build build

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm install

    - name: Run image regression tests
      run: npm run test:image

    - name: Upload test screenshots as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: image-regression-results
        path: |
          tests/image-regression/output/
          tests/image-regression/diff/
        retention-days: 7

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: image-regression-report
        path: tests/image-regression/output/test-report.html
        retention-days: 30